<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Animales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header class="p-3 mb-2 bg-primary fg-contrast-primary">Animales</header>
    <h1>Listado de Animales</h1>
    <a th:href="@{/animals/nuevo}">Crear nuevo animal</a>
    <table class="table">
        <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Nombre</th>
                <th scope="col">Vida media</th>
                <th scope="col">Extinto</th>
                <th scope="col">Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="animal : ${animals}">
                <td th:text="${animal.id}"></td>
                <td th:text="${animal.nombre}"></td>
                <td th:text="${animal.vidaMedia}"></td>
                <td th:text="${animal.extinto ? 'Sí': 'No'}"></td>
                <td><a type="button" class="btn-outline theme-success" th:href="@{/animals/{id}(id=${animal.id})}">Detalles</a>
                    <a type="button" class="btn-outline theme-warning" th:href="@{/animals/{id}/edit(id=${animal.id})}">Editar</a>
                    <a type="button" class="btn-outline theme-danger" th:href="@{/animals/{id}/delete(id=${animal.id})}">Borrar</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
